<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fuin — Font Pair Comparison (free, maximally distinct)</title>

<!-- Google Fonts: one font per distinct category. Body held constant = Geist. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&family=Big+Shoulders+Display:wght@400;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Orbitron:wght@400..900&family=Space+Grotesk:wght@300..700&family=Syne:wght@400..800&family=Unbounded:wght@200..900&display=swap"
  rel="stylesheet"
/>
<!-- Fontshare (free): Clash Display + Switzer (body alt) + Zodiak (serif display) -->
<link
  href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=switzer@400,500,600,700&f[]=zodiak@400,700,900&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --bg: #0a0907;
    --surface: #13110f;
    --ivory: #f2ece1;
    --muted: #b3aca0;
    --steel: #9fb4c7;
    --live: #c1e859;
    --hairline: rgba(242, 236, 225, 0.1);
    --hairline-strong: rgba(242, 236, 225, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ivory); }
  body { font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .bar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10, 9, 7, 0.88);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hairline);
    padding: 14px clamp(1rem, 4vw, 3rem);
    display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }
  .bar h1 { font-size: 0.95rem; font-weight: 600; letter-spacing: -0.01em; }
  .bar .note { font-family: "Geist Mono", monospace; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em; }
  .swatches { display: inline-flex; gap: 8px; align-items: center; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--hairline); }

  .variant { border-bottom: 1px solid var(--hairline); padding: clamp(1.5rem, 4vw, 3rem); max-width: 1240px; margin: 0 auto; }
  .variant-label { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: clamp(1.25rem, 2.5vh, 1.75rem); }
  .variant-num { font-family: "Geist Mono", monospace; font-size: 0.8rem; color: var(--live); letter-spacing: 0.04em; }
  /* label renders IN the display font so you see its character immediately */
  .variant-name { font-size: 1.3rem; font-weight: 700; color: var(--ivory); letter-spacing: -0.01em; }
  .variant-cat { font-family: "Geist Mono", monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

  .hero {
    --display: "Geist", sans-serif;
    --body: "Geist", sans-serif;
    --mono: "Geist Mono", monospace;
    --hstretch: 100%;
    border: 1px solid var(--hairline); border-radius: 14px;
    background: radial-gradient(ellipse 70% 50% at 72% 0%, rgba(193, 232, 89, 0.045), transparent 60%), var(--surface);
    padding: clamp(1.5rem, 3vw, 2.5rem) clamp(1.5rem, 4vw, 3rem) clamp(2rem, 5vh, 3rem);
    overflow: hidden;
  }
  .nav { display: flex; align-items: center; justify-content: space-between; padding-bottom: clamp(1.75rem, 4.5vh, 3rem); }
  .nav .logo { font-family: var(--display); font-weight: 800; font-size: 1.7rem; font-stretch: var(--hstretch); line-height: 1; }
  .nav .links { display: flex; align-items: center; gap: clamp(1rem, 2.5vw, 1.75rem); font-family: var(--body); font-size: 0.85rem; color: var(--muted); }
  .nav .links a { color: inherit; text-decoration: none; }
  .nav .pill { background: var(--live); color: #050505; border-radius: 999px; padding: 0.55rem 1.05rem; font-weight: 600; font-size: 0.85rem; }

  .eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); margin-bottom: clamp(0.9rem, 2.2vh, 1.35rem); }
  .headline {
    font-family: var(--display); font-weight: 800; font-stretch: var(--hstretch);
    font-size: clamp(2.4rem, 5.4vw, 3.9rem); line-height: 1.03; letter-spacing: -0.025em; color: var(--ivory); max-width: 18ch;
  }
  .headline .dim { color: var(--muted); }
  .sub { font-family: var(--body); font-size: clamp(1rem, 1.3vw, 1.12rem); line-height: 1.55; color: var(--muted); max-width: 46ch; margin-top: clamp(1.1rem, 2.6vh, 1.5rem); }
  .ctas { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: clamp(1.4rem, 3.2vh, 2rem); }
  .btn { font-family: var(--body); font-size: 0.95rem; font-weight: 600; padding: 0.8rem 1.4rem; border-radius: 999px; }
  .btn-solid { background: var(--live); color: #050505; }
  .btn-ghost { background: transparent; color: var(--ivory); border: 1px solid var(--hairline-strong); }
  .specimen {
    margin-top: clamp(1.4rem, 3.5vh, 2.25rem); font-family: var(--display); font-stretch: var(--hstretch);
    font-size: 1.45rem; font-weight: 600; color: var(--steel); letter-spacing: -0.005em; line-height: 1.3;
  }
  .specimen small { display: block; font-size: 0.95rem; font-weight: 400; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="bar">
    <h1>Fuin — Font Comparison</h1>
    <div class="swatches">
      <span class="note">palette locked ·</span>
      <span class="sw" style="background:#0a0907"></span>
      <span class="sw" style="background:#f2ece1"></span>
      <span class="sw" style="background:#c1e859"></span>
      <span class="sw" style="background:#9fb4c7"></span>
    </div>
    <span class="note">12 distinct categories · body held = Geist</span>
  </div>

  <div id="root"></div>

<script>
  // Body held constant = Geist so you compare the HEADLINE/display character directly.
  // Each entry is a DIFFERENT visual category so no two look alike.
  const VARIANTS = [
    { n: "01", name: "Geist", cat: "clean neutral baseline (≈ Inter)", display: "'Geist', sans-serif" },
    { n: "02", name: "Archivo Expanded", cat: "wide / engineered / technical", display: "'Archivo', sans-serif", hstretch: "125%" },
    { n: "03", name: "Space Grotesk", cat: "geometric crypto-tech", display: "'Space Grotesk', sans-serif" },
    { n: "04", name: "Clash Display", cat: "characterful modern (Fontshare)", display: "'Clash Display', sans-serif" },
    { n: "05", name: "Bricolage Grotesque", cat: "quirky editorial-grotesque", display: "'Bricolage Grotesque', sans-serif" },
    { n: "06", name: "Unbounded", cat: "rounded / futuristic / sci-fi", display: "'Unbounded', sans-serif" },
    { n: "07", name: "Orbitron", cat: "techno / machine / agentic", display: "'Orbitron', sans-serif" },
    { n: "08", name: "Anton", cat: "heavy condensed poster", display: "'Anton', sans-serif" },
    { n: "09", name: "Big Shoulders Display", cat: "industrial condensed", display: "'Big Shoulders Display', sans-serif" },
    { n: "10", name: "Syne", cat: "expressive geometric display", display: "'Syne', sans-serif" },
    { n: "11", name: "Zodiak", cat: "serif display / editorial (Fontshare)", display: "'Zodiak', serif" },
    { n: "12", name: "JetBrains Mono", cat: "terminal / developer headlines", display: "'JetBrains Mono', monospace" },
  ];

  const hero = (v) => `
    <section class="variant">
      <div class="variant-label">
        <span class="variant-num">${v.n}</span>
        <span class="variant-name" style="font-family:${v.display}; font-stretch:${v.hstretch || "100%"};">${v.name}</span>
        <span class="variant-cat">${v.cat}</span>
      </div>
      <div class="hero" style="--display:${v.display}; --hstretch:${v.hstretch || "100%"};">
        <div class="nav">
          <span class="logo">F</span>
          <div class="links"><a href="#">Docs</a><a href="#">GitHub</a><span class="pill">Launch app</span></div>
        </div>
        <div class="eyebrow">Restricted Access · Solana</div>
        <h1 class="headline">The next wave isn't more access.<br /><span class="dim">It's restricted access.</span></h1>
        <p class="sub">Give an AI agent, a teammate, or your kid a key that spends within your limits. Never drains.</p>
        <div class="ctas"><span class="btn btn-solid">Launch app</span><span class="btn btn-ghost">Read the docs</span></div>
        <div class="specimen">Sign once. Bound every agent.<small>abcdefg · ACCESS · 0123456789 · Fuin</small></div>
      </div>
    </section>`;

  document.getElementById("root").innerHTML = VARIANTS.map(hero).join("");
</script>
</body>
</html>
